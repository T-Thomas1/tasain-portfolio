<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — TaSain Thomas</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #fff; color: #171717;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    h1 { font-size: 48px; font-weight: 600; letter-spacing: -2.4px; margin-bottom: 8px; }
    p { font-size: 18px; color: #4d4d4d; margin-bottom: 24px; }
    a {
      display: inline-block; background: #171717; color: #fff;
      padding: 10px 22px; border-radius: 6px; font-size: 14px;
      font-weight: 500; text-decoration: none;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Page not found.</p>
    <a href="/">Back home</a>
  </div>
</body>
</html>
